<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f8fb" />
  <title>HTL Brasil</title>

  <style>
    :root {
      --text: #111827;
      --muted: #707786;
      --light-blue: #7ec8f3;
      --wa: #2fd36b;
      --kwai: #ff6128;
      --web: #071226;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 18% 10%, rgba(194, 238, 220, .78), transparent 30%),
        radial-gradient(circle at 88% 88%, rgba(218, 210, 255, .42), transparent 34%),
        linear-gradient(150deg, #f5faf8 0%, #f5f4fa 100%);
    }

    .wrap {
      width: min(100%, 460px);
    }

    .card {
      width: 100%;
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(17,24,39,.05);
      border-radius: 30px;
      padding: 30px 22px 24px;
      text-align: center;
      box-shadow: 0 20px 55px rgba(15,23,42,.09);
    }

    .avatar {
      width: 116px;
      height: 116px;
      margin: 0 auto 18px;
      display: block;
      object-fit: cover;
      border-radius: 28px;
      background: #bce7fb;
      box-shadow: 0 10px 24px rgba(59,130,246,.12);
    }

    h1 {
      margin: 0;
      font-size: 46px;
      line-height: 1.02;
      letter-spacing: -1.2px;
      font-weight: 900;
      color: var(--light-blue);
    }

    .sub {
      margin: 14px 0 28px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 700;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 0 20px 0 82px;
      border-radius: 22px;
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -.3px;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover {
      filter: brightness(.98);
    }

    .btn:active {
      transform: scale(.99);
    }

    .dot {
      position: absolute;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.17);
      font-size: 23px;
      font-weight: 900;
    }

    .wa {
      background: var(--wa);
    }

    .kwai {
      background: var(--kwai);
    }

    .ig {
      background: linear-gradient(90deg, #9e3fc1 0%, #f32e55 50%, #f6a640 100%);
    }

    .web {
      background: linear-gradient(90deg, #071226 0%, #0b2149 50%, #071226 100%);
    }

    footer {
      margin-top: 22px;
      color: #a1a6b0;
      font-size: 14px;
      font-weight: 650;
    }

    @media (max-width: 390px) {
      .card {
        padding: 26px 17px 22px;
      }

      .avatar {
        width: 101px;
        height: 101px;
        border-radius: 24px;
      }

      h1 {
        font-size: 39px;
      }

      .sub {
        font-size: 17px;
        margin-bottom: 23px;
      }

      .btn {
        min-height: 64px;
        font-size: 21px;
        padding-left: 72px;
        border-radius: 19px;
      }

      .dot {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        font-size: 20px;
        left: 14px;
      }
    }
  </style>
</head>
