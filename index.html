<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>HTL Brasil</title>
<style>
:root{--text:#111;--muted:#6b7280;--bg1:#f7f8fb;--bg2:#eef2f7;--wa:#25D366;--kwai:#ff5b22;--web:#111827;--ig1:#833ab4;--ig2:#fd1d1d;--ig3:#fcb045}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(37,211,102,.10),transparent 30%),radial-gradient(circle at 90% 90%,rgba(131,58,180,.10),transparent 35%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.wrap{width:min(100%,430px)}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(17,24,39,.07);box-shadow:0 20px 60px rgba(15,23,42,.10);border-radius:28px;padding:34px 22px 24px;text-align:center}
.brand{width:76px;height:76px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;font-weight:900;font-size:25px;letter-spacing:-1px;background:#111;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.14)}
h1{font-size:31px;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.6px}
.sub{font-size:15px;color:var(--muted);margin:0 0 26px}
.links{display:grid;gap:13px}
a{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 18px;border-radius:17px;color:#fff;text-decoration:none;font-size:17px;font-weight:750;letter-spacing:.1px;transition:transform .15s ease,filter .15s ease;box-shadow:0 10px 18px rgba(0,0,0,.08)}
a:active{transform:scale(.985)}
a:hover{filter:brightness(.98)}
.dot{position:absolute;left:17px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:15px;font-weight:900}
.wa{background:var(--wa)}
.kwai{background:var(--kwai)}
.ig{background:linear-gradient(135deg,var(--ig1),var(--ig2) 55%,var(--ig3))}
.web{background:var(--web)}
footer{margin-top:20px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<main class="wrap">
<section class="card" aria-label="HTL Brasil canais oficiais">
<div class="brand">HTL</div>
<h1>HTL Brasil</h1>
<p class="sub">Escolha um canal oficial</p>
<div class="links">
<a class="wa" href="https://wa.me/message/JJXWDPHHIG2PG1?src=qr" target="_blank" rel="noopener"><span class="dot">W</span>WhatsApp</a>
<a class="kwai" href="https://k.kwai.com/u/@htl_allimports/jh2CA9dJ" target="_blank" rel="noopener"><span class="dot">K</span>Kwai</a>
<a class="ig" href="https://www.instagram.com/htl.allimports?igsh=MXVxcGFrZWQzZjdwMA%3D%3D&utm_source=qr" target="_blank" rel="noopener"><span class="dot">I</span>Instagram</a>
<a class="web" href="https://htl.vercel.app" target="_blank" rel="noopener"><span class="dot">H</span>HTL Website</a>
</div>
<footer>HTL Brasil · Canais oficiais</footer>
</section>
</main>
</body>
</html>
